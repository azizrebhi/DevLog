name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devlog
          POSTGRES_PASSWORD: devlog123
          POSTGRES_DB: devlog_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv sync
      
      - name: Run tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run pytest app/tests/ -v --cov=app --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://devlog:devlog123@localhost:5432/devlog_test
          postgres_url: postgresql+asyncpg://devlog:devlog123@localhost:5432/devlog_test  # ← ADD THIS LINE

          SECRET_KEY: test-secret-key-for-ci
          REDIS_URL: redis://localhost:6379/0